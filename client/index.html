<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesay Portfolio</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            min-height: 100vh; 
            overflow-x: hidden;
        }
        
        /* Navigation Bar */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            padding: 1rem 0;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
        }
        .nav-menu {
            display: flex;
            list-style: none;
            gap: 2rem;
            align-items: center;
        }
        .nav-menu a {
            color: #333;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
            padding: 0.5rem 1rem;
            border-radius: 25px;
        }
        .nav-menu a:hover {
            color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }
        .nav-menu a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }
        .nav-menu a:hover::after {
            width: 80%;
        }
        
        /* Mobile Menu */
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #333;
            cursor: pointer;
        }
        .mobile-menu {
            display: none;
            position: fixed;
            top: 70px;
            right: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            padding: 2rem;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .mobile-menu.active {
            display: block;
        }
        .mobile-menu a {
            display: block;
            padding: 1rem 0;
            color: #333;
            text-decoration: none;
            font-weight: 500;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }
        .mobile-menu a:hover {
            color: #667eea;
            padding-left: 1rem;
        }
        
        /* Theme Toggle */
        .theme-toggle {
            background: none;
            border: 2px solid #667eea;
            color: #667eea;
            padding: 0.5rem 1rem;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            margin-left: 1rem;
        }
        .theme-toggle:hover {
            background: #667eea;
            color: white;
        }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; }
        
        /* Hero Section */
        .hero { 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            color: white; 
            text-align: center; 
            padding-top: 80px;
            position: relative;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M 10 0 L 0 0 0 10" fill="none" stroke="%23ffffff" stroke-width="0.5" opacity="0.1"/></pattern></defs><rect width="100" height="100" fill="url(%23grid)"/></svg>');
        }
        .hero-content {
            position: relative;
            z-index: 2;
        }
        
        /* Typewriter Effect */
        .typewriter {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            min-height: 4rem;
        }
        .typewriter-cursor {
            display: inline-block;
            background-color: white;
            margin-left: 3px;
            width: 3px;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        
        .hero h2 { 
            font-size: 1.5rem; 
            margin-bottom: 2rem; 
            opacity: 0.9; 
            animation: fadeInUp 1s ease 2s both;
        }
        .hero p { 
            font-size: 1.2rem; 
            margin-bottom: 2rem; 
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            animation: fadeInUp 1s ease 2.5s both;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .btn { 
            padding: 12px 30px; 
            background: rgba(255,255,255,0.2); 
            color: white; 
            border: 2px solid white; 
            border-radius: 25px; 
            text-decoration: none; 
            margin: 0 10px; 
            transition: all 0.3s ease;
            display: inline-block;
            animation: fadeInUp 1s ease 3s both;
            position: relative;
            overflow: hidden;
        }
        .btn:hover { 
            background: white; 
            color: #667eea; 
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        /* Hire Me Button Special Effects */
        .hire-me-btn {
            background: linear-gradient(135deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            background-size: 400% 400%;
            border: none;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: gradientShift 3s ease infinite, fadeInUp 1s ease 3s both;
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.4);
        }
        .hire-me-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 35px rgba(255, 107, 107, 0.6);
            color: white;
        }
        .btn-shine {
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.5s;
        }
        .hire-me-btn:hover .btn-shine {
            left: 100%;
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .photo-placeholder { 
            width: 300px; 
            height: 300px; 
            background: linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0.1)); 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: white; 
            font-size: 1.1rem; 
            margin: 2rem auto;
            border: 4px solid rgba(255,255,255,0.3);
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        /* Sections */
        .about { padding: 5rem 0; background: white; }
        .about h2 { text-align: center; font-size: 2.5rem; margin-bottom: 3rem; color: #333; }
        .about-content { display: grid; grid-template-columns: 1fr 2fr; gap: 4rem; align-items: center; }
        .about .photo-placeholder { 
            width: 300px; 
            height: 400px; 
            background: linear-gradient(135deg, #667eea, #764ba2); 
            border-radius: 1rem; 
            animation: none;
        }
        .about-text p { margin-bottom: 1.5rem; color: #666; line-height: 1.8; font-size: 1.1rem; }
        
        /* Hire Me Section in About */
        .hire-me-section {
            margin-top: 2rem;
            padding: 2rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 1rem;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
        }
        .hire-me-section h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .hire-me-section p {
            margin-bottom: 1.5rem;
            opacity: 0.9;
        }
        .hire-me-cta {
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            border: none;
            color: white;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .hire-me-cta:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 35px rgba(255, 107, 107, 0.4);
        }
        .hire-me-cta i {
            margin-right: 0.5rem;
        }
        .cta-particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 1px, transparent 1px);
            background-size: 20px 20px;
            animation: particleMove 3s linear infinite;
            opacity: 0;
        }
        .hire-me-cta:hover .cta-particles {
            opacity: 1;
        }
        
        @keyframes particleMove {
            0% { transform: translateY(100%); }
            100% { transform: translateY(-100%); }
        }
        
        .skills { padding: 5rem 0; background: #f8f9fa; }
        .skills h2 { text-align: center; font-size: 2.5rem; margin-bottom: 3rem; color: #333; }
        .skills-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2rem; }
        .skill-card { 
            background: white; 
            padding: 2rem; 
            border-radius: 1rem; 
            text-align: center; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }
        .skill-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
        }
        .skill-icon { font-size: 3rem; margin-bottom: 1rem; }
        
        .contact { padding: 5rem 0; background: white; }
        .contact h2 { text-align: center; font-size: 2.5rem; margin-bottom: 3rem; color: #333; }
        .contact-content { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: start; }
        .contact-info h3 { font-size: 2rem; font-weight: 600; margin-bottom: 1rem; color: #333; }
        .contact-info p { font-size: 1.1rem; color: #666; margin-bottom: 2rem; line-height: 1.6; }
        .contact-details { display: flex; flex-direction: column; gap: 1.5rem; }
        .contact-item { display: flex; align-items: center; gap: 1rem; padding: 1rem; background: #f8f9fa; border-radius: 0.5rem; }
        .contact-item i { font-size: 1.2rem; color: #667eea; }
        .contact-item span { color: #333; font-weight: 500; }
        .contact-form { max-width: 600px; background: #f8f9fa; padding: 2rem; border-radius: 1rem; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group input, .form-group textarea { 
            width: 100%; 
            padding: 0.75rem; 
            border: 2px solid #e9ecef; 
            border-radius: 5px; 
            transition: all 0.3s ease;
        }
        .form-group input:focus, .form-group textarea:focus { 
            outline: none; 
            border-color: #667eea; 
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .nav-menu { display: none; }
            .mobile-menu-btn { display: block; }
            .typewriter { font-size: 2.5rem; }
            .hero h2 { font-size: 1.2rem; }
            .about-content { grid-template-columns: 1fr; text-align: center; gap: 2rem; }
            .contact-content { grid-template-columns: 1fr; gap: 2rem; }
            .photo-placeholder { width: 250px; height: 250px; }
            .about .photo-placeholder { width: 250px; height: 300px; }
            .container { padding: 0 1rem; }
            .floating-telegram, .floating-message { width: 50px; height: 50px; font-size: 1.2rem; }
            .floating-hire { width: 60px; height: 60px; font-size: 1.4rem; }
            .floating-buttons { bottom: 60px; }
        }
        
        @media (max-width: 480px) {
            .typewriter { font-size: 2rem; }
            .nav-container { padding: 0 1rem; }
            .btn { display: block; margin: 0.5rem auto; width: fit-content; }
            .floating-telegram { right: 20px; }
            .floating-message { left: 20px; }
            .floating-hire { width: 55px; height: 55px; font-size: 1.3rem; }
            .floating-buttons { bottom: 40px; }
        }
        
        /* Smooth Scrolling */
        html { scroll-behavior: smooth; }
        
        /* Floating Action Buttons */
        .floating-buttons {
            position: fixed;
            bottom: 80px;
            z-index: 1000;
            width: 100%;
            pointer-events: none;
        }
        .floating-telegram {
            position: absolute;
            right: 30px;
            background: linear-gradient(135deg, #0088cc, #229ED9);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 136, 204, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            animation: pulse 2s infinite;
            pointer-events: all;
        }
        .floating-message {
            position: absolute;
            left: 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            animation: bounce 2s infinite;
            pointer-events: all;
        }
        .floating-hire {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            color: white;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            box-shadow: 0 6px 25px rgba(255, 107, 107, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
            animation: hireMeGlow 2s ease-in-out infinite;
            pointer-events: all;
            border: 3px solid rgba(255, 255, 255, 0.3);
        }
        .floating-hire:hover {
            transform: translateX(-50%) scale(1.15);
            box-shadow: 0 8px 30px rgba(255, 107, 107, 0.7);
        }
        
        @keyframes hireMeGlow {
            0%, 100% { 
                box-shadow: 0 6px 25px rgba(255, 107, 107, 0.5);
                transform: translateX(-50%) scale(1);
            }
            50% { 
                box-shadow: 0 8px 35px rgba(255, 107, 107, 0.8);
                transform: translateX(-50%) scale(1.05);
            }
        }
        .floating-telegram:hover, .floating-message:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.3);
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
        
        /* Tooltip for floating buttons */
        .floating-buttons .tooltip {
            position: absolute;
            bottom: 75px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            font-size: 0.9rem;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .floating-telegram:hover .tooltip {
            opacity: 1;
            right: 0;
        }
        .floating-message:hover .tooltip {
            opacity: 1;
            left: 0;
        }
        
        /* Dark Theme */
        .dark-theme {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }
        .dark-theme .navbar {
            background: rgba(26, 26, 46, 0.95);
        }
        .dark-theme .nav-menu a {
            color: #fff;
        }
        .dark-theme .about, .dark-theme .contact {
            background: #1a1a2e;
            color: #fff;
        }
        .dark-theme .skills {
            background: #16213e;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function Portfolio() {
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [darkTheme, setDarkTheme] = useState(false);
            const [typewriterText, setTypewriterText] = useState('');
            
            const fullText = "Hi, I am Mesay - Full Stack Developer";
            
            useEffect(() => {
                let index = 0;
                let isDeleting = false;
                
                const typeWriter = () => {
                    if (!isDeleting && index <= fullText.length) {
                        setTypewriterText(fullText.slice(0, index));
                        index++;
                    } else if (isDeleting && index >= 0) {
                        setTypewriterText(fullText.slice(0, index));
                        index--;
                    }
                    
                    if (index === fullText.length + 1) {
                        setTimeout(() => {
                            isDeleting = true;
                        }, 2000); // Wait 2 seconds before deleting
                    }
                    
                    if (isDeleting && index === 0) {
                        isDeleting = false;
                    }
                    
                    const speed = isDeleting ? 50 : 100;
                    setTimeout(typeWriter, speed);
                };
                
                typeWriter();
            }, []);

            const scrollToSection = (id) => {
                document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });
                setMobileMenuOpen(false);
            };

            const toggleTheme = () => {
                setDarkTheme(!darkTheme);
                document.body.classList.toggle('dark-theme');
            };

            return (
                <div>
                    {/* Navigation Bar */}
                    <nav className="navbar">
                        <div className="nav-container">
                            <div className="nav-logo" onClick={() => scrollToSection('hero')}>
                                Mesay.dev
                            </div>
                            
                            <ul className="nav-menu">
                                <li><a onClick={() => scrollToSection('hero')}>Home</a></li>
                                <li><a onClick={() => scrollToSection('about')}>About</a></li>
                                <li><a onClick={() => scrollToSection('skills')}>Skills</a></li>
                                <li><a onClick={() => scrollToSection('contact')}>Contact</a></li>
                                <li>
                                    <button className="theme-toggle" onClick={toggleTheme}>
                                        <i className={`fas ${darkTheme ? 'fa-sun' : 'fa-moon'}`}></i>
                                        {darkTheme ? ' Light' : ' Dark'}
                                    </button>
                                </li>
                            </ul>

                            <button 
                                className="mobile-menu-btn" 
                                onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                            >
                                <i className={`fas ${mobileMenuOpen ? 'fa-times' : 'fa-bars'}`}></i>
                            </button>
                        </div>
                        
                        <div className={`mobile-menu ${mobileMenuOpen ? 'active' : ''}`}>
                            <a onClick={() => scrollToSection('hero')}>Home</a>
                            <a onClick={() => scrollToSection('about')}>About</a>
                            <a onClick={() => scrollToSection('skills')}>Skills</a>
                            <a onClick={() => scrollToSection('contact')}>Contact</a>
                            <a onClick={toggleTheme}>
                                <i className={`fas ${darkTheme ? 'fa-sun' : 'fa-moon'}`}></i>
                                {darkTheme ? ' Light Mode' : ' Dark Mode'}
                            </a>
                        </div>
                    </nav>

                    {/* Hero Section */}
                    <section id="hero" className="hero">
                        <div className="container">
                            <div className="hero-content">
                                <div className="typewriter">
                                    {typewriterText}
                                    <span className="typewriter-cursor">|</span>
                                </div>
                                <h2>Building Amazing Web Experiences</h2>
                                <div className="photo-placeholder">
                                    <img 
                                        src="mesay-photo.jpg" 
                                        alt="Mesay - Full Stack Developer" 
                                        style={{
                                            width: '100%', 
                                            height: '100%', 
                                            objectFit: 'cover', 
                                            borderRadius: '50%',
                                            border: '4px solid rgba(255,255,255,0.3)'
                                        }}
                                    />
                                </div>
                                <p>I create modern, responsive, and user-friendly web applications using cutting-edge technologies</p>
                                <a onClick={() => scrollToSection('about')} className="btn">
                                    <i className="fas fa-user"></i> About Me
                                </a>
                                <a onClick={() => scrollToSection('contact')} className="btn hire-me-btn">
                                    <i className="fas fa-briefcase"></i> Hire Me
                                    <span className="btn-shine"></span>
                                </a>
                            </div>
                        </div>
                    </section>

                    {/* About Section */}
                    <section id="about" className="about">
                        <div className="container">
                            <h2><i className="fas fa-user-circle"></i> About Me</h2>
                            <div className="about-content">
                                <div className="photo-placeholder">
                                    <img 
                                        src="mesay-photo.jpg" 
                                        alt="Mesay - Professional Photo" 
                                        style={{
                                            width: '100%', 
                                            height: '100%', 
                                            objectFit: 'cover', 
                                            borderRadius: '1rem'
                                        }}
                                    />
                                </div>
                                <div className="about-text">
                                    <p>I'm a passionate Full Stack Developer with expertise in building modern web applications. I love creating elegant solutions to complex problems and turning ideas into reality.</p>
                                    <p>With a strong foundation in both frontend and backend technologies, I specialize in the MERN stack and have experience working on diverse projects ranging from e-commerce platforms to social media applications.</p>
                                    <p>When I'm not coding, you can find me exploring new technologies, contributing to open-source projects, or sharing knowledge with the developer community.</p>
                                    
                                    <div className="hire-me-section">
                                        <h3>Ready to work together?</h3>
                                        <p>I'm available for freelance projects and full-time opportunities!</p>
                                        <button className="hire-me-cta" onClick={() => scrollToSection('contact')}>
                                            <i className="fas fa-rocket"></i>
                                            <span>Hire Me Now</span>
                                            <div className="cta-particles"></div>
                                        </button>
                                    </div>
                                </div>
                            </div>
